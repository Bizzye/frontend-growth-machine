# Full stack for local development / demo: MongoDB + backend + frontend.
#
# Expects the backend repository cloned next to this one:
#   git clone https://github.com/Bizzye/backend-growth-machine.git ../backend-growth-machine
#
# Usage:
#   docker compose up --build -d                          ->  http://localhost:3000
#   docker compose exec backend node dist/scripts/seed.js  (optional demo users)
name: growth-machine

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend-growth-machine
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/growth-machine
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-chars}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3333:3333"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        # Used by the browser, so it must be reachable from the host machine.
        NEXT_PUBLIC_API_URL: http://localhost:3333/api
    restart: unless-stopped
    environment:
      # Used by the Next.js server (NextAuth + BFF) inside the Docker network.
      API_URL: http://backend:3333/api
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-nextauth-secret-change-me}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
